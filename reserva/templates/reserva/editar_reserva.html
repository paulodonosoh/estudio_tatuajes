{% extends "reserva/base.html" %}

{% block title %}Editar reserva | Estudio de tatuajes{% endblock %}

{% block content %}
<section aria-labelledby="edit-reservation-title">
    <h1 id="edit-reservation-title">Editar reserva</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}

        <button type="submit">Guardar cambios</button>
        <a href="{% url 'lista_reservas' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
