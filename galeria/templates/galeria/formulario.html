{% extends 'core/base.html' %}

{% block title %}{{ accion }} Tatuaje{% endblock %}

{% block content %}
<div class="galeria-container">
    <h2 style="text-align: center;">{{ accion }} Tatuaje</h2>
    
    <div style="max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #dbdbdb; border-radius: 5px;">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div style="margin-top: 20px; text-align: center;">
                <button type="submit" style="background: #222; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Guardar</button>
                <a href="{% url 'lista_tatuajes' %}" style="margin-left: 15px; color: #777; text-decoration: none; font-weight: bold;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
